[project]
name = "lead-hunter-mvp"
version = "0.1.0"
description = "B2B lead generation MVP — 2GIS + Instagram + GPT-4o-mini + wa.me"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
